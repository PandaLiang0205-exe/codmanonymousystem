<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匿名查詢系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
  /* ===== 精緻夜色版 ===== */
  :root {
    --bg: #0e1013;
    --bg-2: #14171b;
    --card: #181b20;
    --card-hi: #1c2026;       /* 卡片 hover 提亮 */
    --field: #101317;
    --ink: #ecedef;
    --muted: #8a919b;
    --line: rgba(255,255,255,0.07);
    --line-hi: rgba(255,255,255,0.13);
    --accent: #6dd3b5;
    --accent-2: #4ab298;
    --accent-soft: #1a2b25;
    --ghost: #23272d;
    --danger: #ea7468;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 0 rgba(255,255,255,0.04) inset, 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.04) inset;
    --ring: 0 0 0 3px rgba(109,211,181,0.22);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  html { color-scheme: dark; }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 700px at 50% -200px, rgba(109,211,181,0.10), transparent 60%),
      radial-gradient(900px 600px at 100% 100%, rgba(74,178,152,0.05), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    font-feature-settings: "ss01", "cv01";
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 18px 80px; }

  /* ---- 標題:襯線 + 漸入 ---- */
  header { animation: rise 0.7s var(--ease) both; }
  header h1 {
    font-family: "Fraunces", "Noto Serif TC", "PingFang TC", serif;
    font-weight: 500;
    font-variation-settings: "opsz" 120, "SOFT" 100;
    font-size: clamp(1.6rem, 4.5vw, 2.1rem);
    letter-spacing: 0.02em;
    margin: 4px 0 6px;
    background: linear-gradient(180deg, #ffffff 0%, #b9c2c8 130%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    color: var(--muted);
    margin: 0 0 22px;
    font-size: 0.92rem;
    letter-spacing: 0.01em;
  }

  /* ---- 卡片:漸層細邊 + 微浮 ---- */
  .card {
    background: linear-gradient(180deg, var(--card) 0%, var(--bg-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    animation: rise 0.7s var(--ease) both;
    animation-delay: 0.08s;
    transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
  }
  .card:hover { border-color: var(--line-hi); }
  .card h2 {
    font-family: "Noto Serif TC", "Fraunces", serif;
    font-weight: 500;
    font-size: 1rem;
    margin: 0 0 14px;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  /* ---- 輸入框:聚焦光暈 ---- */
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    font: inherit;
    font-size: 1rem;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--field);
    color: var(--ink);
    transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), background 0.2s var(--ease);
  }
  input::placeholder { color: var(--muted); }
  input:hover { border-color: var(--line-hi); }
  input:focus {
    outline: none;
    border-color: var(--accent);
    background: #0f1418;
    box-shadow: var(--ring);
  }

  .search-box { animation-delay: 0.16s; }
  .search-box input {
    font-size: 1.05rem;
    padding: 16px 18px;
  }

  /* ---- 按鈕:漸層 + 微浮 + 聚焦環 ---- */
  button {
    font-family: inherit;
    font-size: 0.98rem;
    font-weight: 500;
    padding: 12px 18px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #06120e;
    cursor: pointer;
    min-height: 48px;
    letter-spacing: 0.02em;
    box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 4px 14px rgba(74,178,152,0.18);
    transition: transform 0.15s var(--ease), box-shadow 0.2s var(--ease), filter 0.2s var(--ease);
  }
  button:hover { filter: brightness(1.06); box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 6px 18px rgba(74,178,152,0.28); }
  button:active { transform: translateY(1px); filter: brightness(0.97); }
  button:focus-visible { outline: none; box-shadow: var(--ring), 0 4px 14px rgba(74,178,152,0.18); }

  button.secondary {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--line-hi);
    box-shadow: none;
  }
  button.secondary:hover { background: #213830; }

  button.ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--line-hi);
    box-shadow: none;
  }
  button.ghost:hover { background: var(--ghost); }

  button.danger {
    background: linear-gradient(180deg, var(--danger) 0%, #c95a4f 100%);
    color: #1a0805;
    box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 4px 14px rgba(234,116,104,0.22);
  }
  button.mini { padding: 9px 14px; font-size: 0.85rem; min-height: 0; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .add-fields { display: grid; gap: 10px; margin-bottom: 12px; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

  .count {
    color: var(--muted);
    font-size: 0.82rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 8px 4px 12px;
  }

  /* ---- 結果列表:每筆 stagger 進場 ---- */
  ul.results { list-style: none; padding: 0; margin: 0; }
  ul.results li {
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-bottom: 10px;
    background: linear-gradient(180deg, var(--card) 0%, var(--bg-2) 100%);
    transition: border-color 0.2s var(--ease), transform 0.2s var(--ease), background 0.2s var(--ease);
    animation: rise 0.45s var(--ease) both;
  }
  ul.results li:hover {
    border-color: var(--line-hi);
    background: linear-gradient(180deg, var(--card-hi) 0%, var(--bg-2) 100%);
  }
  /* 前 8 筆遞延進場(更多就同步出現,避免太慢) */
  ul.results li:nth-child(1) { animation-delay: 0.02s; }
  ul.results li:nth-child(2) { animation-delay: 0.05s; }
  ul.results li:nth-child(3) { animation-delay: 0.08s; }
  ul.results li:nth-child(4) { animation-delay: 0.11s; }
  ul.results li:nth-child(5) { animation-delay: 0.14s; }
  ul.results li:nth-child(6) { animation-delay: 0.17s; }
  ul.results li:nth-child(7) { animation-delay: 0.20s; }
  ul.results li:nth-child(8) { animation-delay: 0.23s; }

  .result-name {
    font-weight: 700;
    font-size: 1.06rem;
    letter-spacing: 0.01em;
  }
  .result-code {
    font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-weight: 500;
    font-size: 0.92rem;
    color: var(--accent);
    word-break: break-all;
    margin-top: 4px;
    letter-spacing: -0.01em;
  }
  .result-actions { display: flex; gap: 8px; margin-top: 12px; }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 32px 0;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
  }

  .edit-fields { display: grid; gap: 10px; }

  /* ---- Toast:略帶彈性的進場 ---- */
  #toast {
    position: fixed; left: 50%; bottom: 28px;
    transform: translateX(-50%) translateY(24px) scale(0.96);
    background: rgba(28, 32, 38, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--ink);
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid var(--line-hi);
    font-size: 0.93rem;
    letter-spacing: 0.02em;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.35s var(--ease), opacity 0.25s var(--ease);
    z-index: 50;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.55);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

  .danger-text { color: var(--danger); }
  details summary {
    cursor: pointer;
    color: var(--accent);
    font-size: 0.92rem;
    letter-spacing: 0.02em;
  }

  .admin-only { display: none; }
  body.admin .admin-only { display: block; animation: rise 0.45s var(--ease) both; }

  /* ---- 登入表單 ---- */
  .login-form {
    max-width: 340px; margin: 14px auto 0; text-align: left;
    display: grid; gap: 10px;
    animation: rise 0.35s var(--ease) both;
  }

  /* ---- 對話框:遮罩淡入 + 內容上浮 ---- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(6, 8, 11, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 60; padding: 16px;
    animation: fade 0.2s var(--ease) both;
  }
  .overlay .modal {
    background: linear-gradient(180deg, var(--card) 0%, var(--bg-2) 100%);
    border: 1px solid var(--line-hi);
    border-radius: var(--radius);
    padding: 22px;
    max-width: 360px; width: 100%;
    box-shadow: var(--shadow-md);
    animation: rise 0.3s var(--ease) both;
  }
  .overlay .modal p { margin: 0 0 18px; }

  /* ---- 管理員登入鈕:置中 + 樸素 ---- */
  #adminBtn {
    background: transparent;
    border: 1px solid var(--line-hi);
    color: var(--muted);
    box-shadow: none;
    transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
  }
  #adminBtn:hover { color: var(--ink); border-color: var(--accent); }

  /* ---- 動畫定義 ---- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  /* ---- 手機優化 ---- */
  @media (max-width: 520px) {
    .wrap { padding: 18px 14px 64px; }
    header h1 { font-size: 1.55rem; }
    header p { font-size: 0.88rem; margin-bottom: 18px; }
    .card { padding: 16px; border-radius: 12px; }
    .search-box input { font-size: 1rem; padding: 15px 16px; }
    button { padding: 11px 16px; min-height: 46px; }
    button.mini { min-height: 38px; }
    .result-name { font-size: 1rem; }
    .result-code { font-size: 0.88rem; }
    #toast { bottom: 20px; font-size: 0.88rem; padding: 11px 18px; }
  }
  @media (max-width: 420px) {
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>匿名查詢系統</h1>
    <p>輸入名字或匿名亂碼，即時查詢對應資料。</p>
  </header>

  <!-- ===== 查詢區塊 ===== -->
  <div class="card search-box">
    <input id="searchInput" type="text" placeholder="輸入名字或匿名亂碼…" autocomplete="off">
  </div>

  <div class="count" id="count"></div>
  <ul class="results" id="results"></ul>

  <!-- ===== 新增資料區塊（僅管理員可見） ===== -->
  <div class="card admin-only">
    <h2>新增資料</h2>
    <div class="add-fields">
      <input id="addName" type="text" placeholder="名字" autocomplete="off">
      <input id="addCode" type="text" placeholder="匿名亂碼（開頭的 [ 可不輸入，系統會自動補上）" autocomplete="off">
    </div>
    <button id="addBtn">新增</button>
  </div>

  <!-- ===== 管理員登入／登出（一般訪客只會看到「管理員登入」） ===== -->
  <div style="text-align:center; padding:8px 0 24px;">
    <button id="adminBtn" class="ghost mini">管理員登入</button>

    <!-- 頁面內建的登入表單（不使用會被預覽擋掉的彈出視窗） -->
    <div id="loginForm" class="card login-form" style="display:none;">
      <input id="loginUser" type="text" placeholder="帳號（Email）" autocomplete="off">
      <input id="loginPass" type="password" placeholder="密碼" autocomplete="off">
      <button id="loginSubmit">登入</button>
    </div>
  </div>
</div>

<!-- ===== 自訂確認對話框（取代會被預覽擋掉的 confirm()） ===== -->
<div id="confirmOverlay" class="overlay" style="display:none;">
  <div class="modal">
    <p id="confirmMsg"></p>
    <div class="btn-row" style="justify-content:flex-end;">
      <button id="confirmCancel" class="ghost mini">取消</button>
      <button id="confirmOk" class="danger mini">確定</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

/* 目前所有資料：[{ id, name, code }, ...] */
let entries = [];
/* 正在編輯的那筆資料的 id（null 表示沒有在編輯） */
let editingId = null;
/* 是否為已登入的管理員 */
let isAdmin = false;


/* ---------- 2 & 3. 解析 + 清洗（給「自動匯入預設」與「重置」使用） ---------- */
function parseRawData(raw) {
  const lines = raw.split("\n").map(l => l.trim()).filter(l => l.length > 0);
  const result = [];
  const seenCodes = new Set();
  for (let i = 0; i + 1 < lines.length; i += 2) {
    const name = cleanName(lines[i]);
    const code = cleanCode(lines[i + 1]);
    if (!name || !code) continue;
    if (seenCodes.has(code)) continue;
    seenCodes.add(code);
    result.push({ name, code });
  }
  return result;
}
/* 清洗名字：移除結尾的全形「：」或半形「:」並去空白 */
function cleanName(line) { return line.replace(/[：:]\s*$/, "").trim(); }
/* 清洗亂碼：全形［轉半形 [，並去空白（不自動補 ]） */
function cleanCode(line) { return line.replace(/［/g, "[").trim(); }


/* ---------- 4. 從 Supabase 讀取全部資料 ---------- */
async function loadEntries() {
  if (!db) return;
  const { data, error } = await db
    .from("entries")
    .select("id,name,code")
    .order("created_at", { ascending: true });
  if (error) { showToast("讀取失敗：" + error.message); return; }
  entries = data || [];
  renderResults();
}


/* ---------- 5. 搜尋 + 顯示結果 ----------
   名字或亂碼只要「包含」輸入文字即算符合（不分大小寫）；
   搜尋欄空白時不列出全部，只顯示提示。 */
function renderResults() {
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  const listEl = document.getElementById("results");
  const countEl = document.getElementById("count");

  listEl.innerHTML = ""; // 清空我們自己產生的節點（安全）

  if (query === "") {
    countEl.textContent = "";
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "請在上方輸入名字或匿名亂碼開始查詢";
    listEl.appendChild(li);
    return;
  }

  const matched = entries.filter(item =>
    item.name.toLowerCase().includes(query) ||
    item.code.toLowerCase().includes(query)
  );

  if (matched.length === 0) {
    countEl.textContent = "";
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "查無資料";
    listEl.appendChild(li);
    return;
  }

  countEl.textContent = `共 ${matched.length} 筆結果`;

  // 全程用 textContent / DOM 建立，不使用 innerHTML 插入使用者輸入，避免 XSS
  matched.forEach(item => {
    listEl.appendChild(
      editingId === item.id ? buildEditRow(item) : buildViewRow(item)
    );
  });
}

/* 建立「一般顯示」列：訪客只看到名字與亂碼；管理員才看到編輯／刪除 */
function buildViewRow(item) {
  const li = document.createElement("li");

  const nameEl = document.createElement("div");
  nameEl.className = "result-name";
  nameEl.textContent = item.name;

  const codeEl = document.createElement("div");
  codeEl.className = "result-code";
  codeEl.textContent = item.code;

  li.appendChild(nameEl);
  li.appendChild(codeEl);

  if (!isAdmin) return li;

  const actions = document.createElement("div");
  actions.className = "result-actions";

  const editBtn = document.createElement("button");
  editBtn.className = "secondary mini";
  editBtn.textContent = "編輯";
  editBtn.onclick = () => { editingId = item.id; renderResults(); };

  const delBtn = document.createElement("button");
  delBtn.className = "danger mini";
  delBtn.textContent = "刪除";
  delBtn.onclick = () => deleteEntry(item.id);

  actions.appendChild(editBtn);
  actions.appendChild(delBtn);
  li.appendChild(actions);
  return li;
}

/* 建立「編輯中」列（輸入框 + 儲存／取消） */
function buildEditRow(item) {
  const li = document.createElement("li");
  const box = document.createElement("div");
  box.className = "edit-fields";

  const nameInput = document.createElement("input");
  nameInput.type = "text"; nameInput.value = item.name; nameInput.placeholder = "名字";

  const codeInput = document.createElement("input");
  codeInput.type = "text"; codeInput.value = item.code; codeInput.placeholder = "匿名亂碼";

  const actions = document.createElement("div");
  actions.className = "result-actions";

  const saveBtn = document.createElement("button");
  saveBtn.className = "mini";
  saveBtn.textContent = "儲存";
  saveBtn.onclick = () => saveEdit(item.id, nameInput.value, codeInput.value);

  const cancelBtn = document.createElement("button");
  cancelBtn.className = "ghost mini";
  cancelBtn.textContent = "取消";
  cancelBtn.onclick = () => { editingId = null; renderResults(); };

  actions.appendChild(saveBtn);
  actions.appendChild(cancelBtn);
  box.appendChild(nameInput);
  box.appendChild(codeInput);
  box.appendChild(actions);
  li.appendChild(box);
  return li;
}


/* ---------- 6 & 12. 新增資料（防止重複亂碼） ----------
   亂碼的唯一性同時由資料庫的 UNIQUE 約束強制保證，重複時會收到 23505 錯誤。 */
async function addEntry() {
  if (!db) return;
  const nameEl = document.getElementById("addName");
  const codeEl = document.getElementById("addCode");
  const name = nameEl.value.trim();
  let code = cleanCode(codeEl.value);

  if (!name) { showToast("名字不能空白"); return; }
  if (!code) { showToast("匿名亂碼不能空白"); return; }
  if (!code.startsWith("[")) code = "[" + code; // 沒有 [ 就自動補（不補 ]）

  const { error } = await db.from("entries").insert({ name, code });
  if (error) {
    showToast(error.code === "23505" ? "此匿名亂碼已存在" : "新增失敗：" + error.message);
    return;
  }
  nameEl.value = ""; codeEl.value = "";
  showToast("新增成功");
  loadEntries();
}


/* ---------- 7. 刪除資料（單筆，含自訂確認框） ---------- */
async function deleteEntry(id) {
  if (!db) return;
  if (!(await showConfirm("確定要刪除這筆資料嗎？"))) return;
  const { error } = await db.from("entries").delete().eq("id", id);
  if (error) { showToast("刪除失敗：" + error.message); return; }
  if (editingId === id) editingId = null;
  showToast("已刪除");
  loadEntries();
}


/* ---------- 8. 編輯資料（儲存修改，防重複） ---------- */
async function saveEdit(id, newName, newCode) {
  if (!db) return;
  newName = newName.trim();
  newCode = cleanCode(newCode);
  if (!newName) { showToast("名字不能空白"); return; }
  if (!newCode) { showToast("匿名亂碼不能空白"); return; }
  if (!newCode.startsWith("[")) newCode = "[" + newCode;

  const { error } = await db.from("entries").update({ name: newName, code: newCode }).eq("id", id);
  if (error) {
    showToast(error.code === "23505" ? "此匿名亂碼已存在" : "更新失敗：" + error.message);
    return;
  }
  editingId = null;
  showToast("已更新");
  loadEntries();
}


/* 自動匯入預設：雲端是空的、且目前是管理員時，把預設資料寫進雲端 */
async function seedIfEmpty() {
  if (!db || !isAdmin) return;
  const { count, error } = await db.from("entries").select("id", { count: "exact", head: true });
  if (error || (count && count > 0)) return; // 已經有資料就不重複匯入
  const res = await db.from("entries").upsert(parseRawData(RAW_DATA), { onConflict: "code", ignoreDuplicates: true });
  if (!res.error) { showToast("已匯入預設資料"); loadEntries(); }
}


/* ---------- 小工具：自訂確認對話框（回傳 Promise<boolean>） ---------- */
function showConfirm(message) {
  return new Promise(resolve => {
    const overlay = document.getElementById("confirmOverlay");
    document.getElementById("confirmMsg").textContent = message;
    overlay.style.display = "flex";
    const ok = document.getElementById("confirmOk");
    const cancel = document.getElementById("confirmCancel");
    function close(result) {
      overlay.style.display = "none";
      ok.onclick = null; cancel.onclick = null;
      resolve(result);
    }
    ok.onclick = () => close(true);
    cancel.onclick = () => close(false);
  });
}

/* ---------- 小工具：顯示提示訊息 ---------- */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}


/* ---------- 管理員：登入 / 登出（使用 Supabase Auth，真正的身分驗證） ---------- */
function applyAdminUI() {
  document.body.classList.toggle("admin", isAdmin);
  document.getElementById("adminBtn").textContent = isAdmin ? "管理員登出" : "管理員登入";
  if (isAdmin) document.getElementById("loginForm").style.display = "none";
}

/* 點「管理員登入」：已登入就登出；未登入就顯示／隱藏登入表單 */
function toggleAdmin() {
  if (!db) { showToast("尚未設定 Supabase 連線"); return; }
  if (isAdmin) {
    db.auth.signOut(); // 之後由 onAuthStateChange 更新畫面
    showToast("已登出");
  } else {
    const form = document.getElementById("loginForm");
    form.style.display = form.style.display === "none" ? "grid" : "none";
  }
}

/* 按「登入」：用 Email + 密碼向 Supabase 驗證 */
async function doLogin() {
  if (!db) return;
  const email = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value;
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) { showToast("登入失敗：帳號或密碼錯誤"); return; }
  document.getElementById("loginUser").value = "";
  document.getElementById("loginPass").value = "";
  showToast("已登入管理員"); // 畫面切換由 onAuthStateChange 處理
}


/* ---------- 初始化 ---------- */
async function init() {
  const listEl = document.getElementById("results");

  // 還沒設定好 Supabase → 顯示提示就好
  if (!window.supabase || !db) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "尚未設定 Supabase 連線。請編輯 index.html，填入 SUPABASE_URL 與 SUPABASE_ANON_KEY 後再部署。";
    listEl.appendChild(li);
    return;
  }

  document.getElementById("searchInput").addEventListener("input", renderResults);
  document.getElementById("addBtn").addEventListener("click", addEntry);
  document.getElementById("adminBtn").addEventListener("click", toggleAdmin);
  document.getElementById("loginSubmit").addEventListener("click", doLogin);

  applyAdminUI();

  // 監聽登入狀態：登入/登出時自動更新畫面；登入後若雲端是空的就匯入預設
  db.auth.onAuthStateChange((event, session) => {
    isAdmin = !!session;
    applyAdminUI();
    renderResults();
    if (isAdmin) seedIfEmpty();
  });

  await loadEntries();

  // 即時同步：別人（或你）改動資料時自動重新載入。
  // （需在 Supabase 後台為 entries 開啟 Realtime；沒開也沒關係，重新整理即可看到最新。）
  db.channel("entries-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "entries" }, () => loadEntries())
    .subscribe();
}

init();
