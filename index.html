<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匿名查詢系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  /* 版面：滿版黃色查詢帶（亂碼開頭的 [ 就是搜尋欄）＋下方安靜的結果表 */
  :root {
    --band: #ffcb2e; --band-ink: #17191c;
    --bg: #f3f4f2; --panel: #ffffff; --ink: #17191c; --muted: #5b6167;
    --mark: #ffe08a; --mark-ink: #17191c;
    --danger: #b3261e; --warn: #7a4d00; --solid: #17191c; --on-solid: #ffffff;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --mono: "Martian Mono", ui-monospace, Consolas, monospace;
    --ease: cubic-bezier(.2,.8,.2,1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c; --panel: #202327; --ink: #f1f2ef; --muted: #a4abb1;
      --mark: #ffcb2e; --danger: #ff8a7f; --warn: #ffcb2e;
      --solid: #f1f2ef; --on-solid: #17191c; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
  .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding-inline: 20px; }
  :focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }

  /* 查詢帶 */
  .band { background: var(--band); color: var(--band-ink); padding: 14px 0 clamp(32px, 6vw, 64px); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px; }
  .topbar h1 { margin: 0; font-size: 1.125rem; font-weight: 900; }
  .search-box { display: flex; align-items: center; gap: clamp(8px, 2vw, 20px); margin-top: clamp(32px, 7vw, 80px); font-size: clamp(1.75rem, 6.4vw, 4.5rem); border-bottom: 4px solid var(--band-ink); cursor: text; transition: box-shadow .2s var(--ease); }
  .search-box:focus-within { box-shadow: 0 4px 0 var(--band-ink); }
  .count:empty { padding-bottom: 0; }
  .bracket { margin-left: -.1em; font: 700 1.25em/1.3 var(--mono); transition: transform .25s var(--ease); }
  .search-box:focus-within .bracket { transform: translateX(-.05em); }
  .search-box input { flex: 1; min-width: 0; width: 100%; padding: .25em 0; border: 0; background: none; color: inherit; font: 900 1em/1.3 var(--sans); outline: 0; caret-color: var(--band-ink); appearance: none; }
  .search-box input::placeholder { color: var(--band-ink); opacity: .64; }
  .search-box input::-webkit-search-cancel-button { display: none; }

  .demo-banner { background: #17191c; color: #fff; padding: 12px 20px; font-size: .9rem; }

  /* 結果 */
  main { padding-bottom: 80px; }
  .count { padding: 24px 0 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  ul.results { list-style: none; padding: 0; margin: 0; }
  ul.results li { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 4fr) minmax(0, 5fr); align-items: center; gap: 6px 24px; min-height: 60px; padding: 8px 12px; margin-inline: -12px; transition: background-color .15s; } @media (hover: hover) { ul.results li:not(.empty):hover { background: var(--panel); } } .admin-lists ul.results li { grid-template-columns: minmax(0, 1fr) auto; } .admin-lists .result-actions { grid-column: 1 / -1; justify-content: flex-start; }
  .result-name { font-size: 1.375rem; font-weight: 900; line-height: 1.35; overflow-wrap: anywhere; }
  .result-code { font: 500 1.0625rem/1.5 var(--mono); font-variant-ligatures: none; overflow-wrap: anywhere; user-select: all; }
  mark { background: var(--mark); color: var(--mark-ink); }
  .result-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .recent-time { grid-column: 1 / -1; color: var(--muted); font-size: .875rem; }
  .pending-badge { display: inline-block; margin-left: 10px; font-size: .8125rem; font-weight: 700; color: var(--warn); border-bottom: 2px dashed currentColor; }
  ul.results li.empty { display: block; min-height: 0; padding: 8px 12px 32px; color: var(--muted); font-size: 1.0625rem; }

  /* 管理區 */
  .admin-only { display: none; }
  body.admin .admin-only { display: block; }
  .admin-area { margin-top: 48px; }
  .admin-area h2 { margin: 0 0 16px; font-size: 1.375rem; font-weight: 900; }
  .add-panel { background: var(--panel); padding: clamp(18px, 3vw, 28px); }
  .add-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .field { display: grid; gap: 6px; font-size: .875rem; font-weight: 700; min-width: 0; }
  .admin-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-top: 48px; align-items: start; }
  .admin-lists > * { min-width: 0; }
  .admin-lists .result-name { font-size: 1.0625rem; }
  .admin-lists .result-code { font-size: .875rem; }
  .field input, .edit-fields input { width: 100%; min-height: 48px; padding: 10px 12px; border: 2px solid var(--muted); border-radius: 0; background: var(--bg); color: var(--ink); font: 500 1rem/1.4 var(--sans); }
  .field input:focus, .edit-fields input:focus { outline: 3px solid var(--band); outline-offset: 0; border-color: var(--ink); }
  .edit-fields { grid-column: 1 / -1; display: grid; gap: 10px; }
  .field input.code-input, .edit-fields input.code-input { font-family: var(--mono); }

  /* 按鈕 */
  button { min-height: 48px; padding: 10px 20px; border: 2px solid var(--solid); border-radius: 0; background: var(--solid); color: var(--on-solid); font: 700 1rem/1.3 var(--sans); cursor: pointer; transition: transform .15s var(--ease), background-color .15s, color .15s; }
  button:active { transform: translateY(2px); }
  button.secondary, button.ghost, button.danger { background: transparent; color: var(--ink); border-color: currentColor; }
  button.danger { color: var(--danger); }
  button.mini { min-height: 44px; padding: 8px 14px; font-size: .875rem; }
  @media (hover: hover) {
    button:hover, button.secondary:hover, button.ghost:hover { background: var(--band); border-color: var(--band-ink); color: var(--band-ink); }
    button.danger:hover { background: var(--danger); border-color: var(--danger); color: var(--bg); }
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
  #adminBtn { color: var(--band-ink); border-color: var(--band-ink); background: transparent; }
  #adminBtn:hover { background: var(--band-ink); color: var(--band); }
  .login-form { grid-template-columns: 1fr 1fr auto; gap: 14px; align-items: end; padding-top: 18px; animation: drop .25s var(--ease); }
  .login-form .field input { background: #fff; color: #17191c; border-color: #17191c; }
  .login-form .field input:focus { outline-color: #17191c; }
  .login-form #loginSubmit { background: #17191c; color: #fff; border-color: #17191c; }

  /* 確認框與提示 */
  .overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgb(10 11 13 / .7); }
  .modal { width: 100%; max-width: 400px; padding: 28px; background: var(--panel); animation: drop .25s var(--ease); }
  .modal p { margin: 0 0 24px; font-size: 1.125rem; font-weight: 700; }
  #toast { position: fixed; z-index: 70; left: 50%; bottom: 24px; max-width: 90vw; padding: 14px 22px; background: var(--solid); color: var(--on-solid); font-weight: 700; opacity: 0; transform: translate(-50%, 20px); pointer-events: none; transition: transform .25s var(--ease), opacity .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @keyframes drop { from { transform: translateY(-14px); } }

  @media (max-width: 700px) {
    .add-fields, .admin-lists, .login-form { grid-template-columns: 1fr; }
    ul.results li, .admin-lists ul.results li { grid-template-columns: minmax(0, 1fr); gap: 2px; padding-block: 10px; }
    .result-actions { justify-content: flex-start; padding-top: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<!-- 模擬模式提示橫條（只有在網址 #demo 時才顯示） -->
<div id="demoBanner" class="demo-banner" style="display:none;">
  <strong>模擬登入模式</strong>：這裡是示範資料，變更不會寫進 Supabase，重新整理就會還原。
</div>

<!-- ===== 查詢區塊 ===== -->
<header class="band">
  <div class="wrap">
    <div class="topbar">
      <h1>匿名查詢系統</h1>
      <button id="adminBtn" class="ghost mini" type="button">管理員登入</button>
    </div>
    <form id="loginForm" class="login-form" style="display:none;">
      <label class="field">帳號（Email）<input id="loginUser" type="text" inputmode="email" autocomplete="off"></label>
      <label class="field">密碼<input id="loginPass" type="password" autocomplete="off"></label>
      <button id="loginSubmit" type="submit">登入</button>
    </form>
    <label class="search-box">
      <span class="bracket" aria-hidden="true">[</span>
      <input id="searchInput" type="search" aria-label="輸入名字或匿名亂碼" placeholder="名字或匿名亂碼" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
  </div>
</header>

<main class="wrap">
  <div class="count" id="count" role="status"></div>
  <ul class="results" id="results"></ul>

  <!-- ===== 管理區（僅管理員可見） ===== -->
  <div class="admin-only admin-area">
    <section class="add-panel">
      <h2>新增資料</h2>
      <div class="add-fields">
        <label class="field">名字<input id="addName" type="text" autocomplete="off"></label>
        <label class="field">匿名亂碼（開頭的 [ 可不輸入）<input id="addCode" class="code-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      </div>
      <div class="btn-row">
        <button id="addBtn" type="button">新增</button>
        <button id="addPendingBtn" class="secondary" type="button">加入待確認</button>
      </div>
    </section>
    <div class="admin-lists">
      <section><h2>待確認清單</h2><ul class="results" id="pendingList"></ul></section>
      <section><h2>最近新增</h2><ul class="results" id="recentList"></ul></section>
    </div>
  </div>
</main>

<!-- ===== 自訂確認對話框（取代會被預覽擋掉的 confirm()） ===== -->
<div id="confirmOverlay" class="overlay" style="display:none;">
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmMsg">
    <p id="confirmMsg"></p>
    <div class="btn-row" style="justify-content:flex-end;">
      <button id="confirmCancel" class="ghost mini" type="button">取消</button>
      <button id="confirmOk" class="danger mini" type="button">確定</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

   資料存在 Supabase 資料庫，所有人看到同一份；只有「登入的管理員」可以
   新增 / 編輯 / 刪除（由資料庫的 RLS 權限規則強制保護，不是只靠前端藏按鈕）。
   ========================================================================= */

/* ---------- 0. Supabase 連線設定 ----------
   ★ 部署前必填：到 Supabase 後台 Settings → API 複製這兩個值貼上 ★
   anon key 是設計給前端公開使用的，放在這裡是正常且安全的；
   ⚠ 千萬不要把 service_role key 放進來（那把鑰匙會繞過所有權限）。 */
const SUPABASE_URL = "https://mmthscwbjxejhgrnuidx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_VZ7m_6_D4bVeCR14LlkT7A_3_lxseJm";

/* 建立 Supabase 用戶端。若還沒填好設定，db 會是 null，頁面會顯示提示。 */
let db = null;
try {
  if (window.supabase && SUPABASE_URL.indexOf("YOUR-PROJECT") === -1) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) {}

/* ===== 模擬登入模式 =====
   網址加上 #demo（或點頁面下方「進入模擬登入」）即啟用。
   會用一個假的 db 物件取代 Supabase，所有 CRUD 都只改瀏覽器分頁內的記憶體陣列；
   不會打網路、不會碰雲端、重新整理就回到初始示範資料。
   目的：免 Supabase 設定也能完整體驗管理介面。 */
const DEMO_MODE = location.hash === "#demo";

function makeMockDb() {
  const now = Date.now();
  let rows = [
    { id: "demo-1", name: "示範:王小明",   code: "[ab12cd]", created_at: new Date(now - 86400000 * 3).toISOString(), pending: false },
    { id: "demo-2", name: "示範:陳大華",   code: "[ef34gh]", created_at: new Date(now - 86400000 * 1).toISOString(), pending: false },
    { id: "demo-3", name: "示範:李曉雯",   code: "[ij56kl]", created_at: new Date(now - 3600000 * 8).toISOString(), pending: true  },
    { id: "demo-4", name: "示範:張小美",   code: "[mn78op]", created_at: new Date(now - 3600000 * 2).toISOString(), pending: false },
    { id: "demo-5", name: "示範:Brian 黃", code: "[qr90st]", created_at: new Date(now - 60000 * 15).toISOString(),  pending: true  },
  ];
  const ok = () => Promise.resolve({ error: null });

  return {
    from() {
      return {
        select() {
          return {
            order(col, opts) {
              const sorted = [...rows].sort((a, b) => {
                const av = a[col] || "", bv = b[col] || "";
                return opts && opts.ascending === false
                  ? String(bv).localeCompare(String(av))
                  : String(av).localeCompare(String(bv));
              });
              return Promise.resolve({ data: sorted, error: null });
            }
          };
        },
        insert(row) {
          if (rows.some(r => r.code === row.code)) {
            return Promise.resolve({ error: { code: "23505", message: "duplicate code" } });
          }
          rows.push({
            id: "demo-" + Math.random().toString(36).slice(2, 10),
            name: row.name,
            code: row.code,
            pending: row.pending === true,
            created_at: new Date().toISOString()
          });
          return ok();
        },
        update(patch) {
          return {
            eq(col, val) {
              rows = rows.map(r => r[col] === val ? { ...r, ...patch } : r);
              return ok();
            }
          };
        },
        delete() {
          return {
            eq(col, val) {
              rows = rows.filter(r => r[col] !== val);
              return ok();
            }
          };
        }
      };
    },
    auth: {
      signOut: () => ok(),
      signInWithPassword: () => ok(),
      onAuthStateChange: () => ({ data: { subscription: { unsubscribe() {} } } })
    },
    channel() {
      const ch = { on() { return ch; }, subscribe() { return ch; } };
      return ch;
    }
  };
}

if (DEMO_MODE) {
  db = makeMockDb();
}

/* 目前所有資料：[{ id, name, code }, ...] */
let entries = [];
/* 正在編輯的那筆資料的 id（null 表示沒有在編輯） */
let editingId = null;
/* 是否為已登入的管理員 */
let isAdmin = false;
/* 資料是否已讀取完成 */
let loaded = false;
/* 上一次顯示的結果 id：只有新出現的列才播放解碼動畫 */
let shownIds = new Set();
const canDecode = !!(window.gsap && window.ScrambleTextPlugin);
if (canDecode) gsap.registerPlugin(ScrambleTextPlugin);

/* 把符合查詢的文字標出來（只用 DOM 節點，不用 innerHTML） */
function setHighlighted(el, text, query) {
  const lower = text.toLowerCase();
  const i = query && lower.length === text.length ? lower.indexOf(query) : -1;
  if (i < 0) { el.replaceChildren(text); return; }
  const m = document.createElement("mark");
  m.textContent = text.slice(i, i + query.length);
  el.replaceChildren(text.slice(0, i), m, text.slice(i + query.length));
}

/* 名字從亂碼字元解出來。動畫庫沒載入或使用者偏好減少動態時直接顯示名字 */
function decodeName(el, item, query, delay) {
  if (!canDecode || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  el.textContent = item.code;
  gsap.to(el, {
    duration: 0.55, delay, ease: "none",
    scrambleText: { text: item.name, chars: item.code, speed: 0.6 },
    onComplete: () => setHighlighted(el, item.name, query)
  });
}


/* ---------- 2 & 3. 解析 + 清洗（給「自動匯入預設」與「重置」使用） ---------- */
function parseRawData(raw) {
  const lines = raw.split("\n").map(l => l.trim()).filter(l => l.length > 0);
  const result = [];
  const seenCodes = new Set();
  for (let i = 0; i + 1 < lines.length; i += 2) {
    const name = cleanName(lines[i]);
    const code = cleanCode(lines[i + 1]);
    if (!name || !code) continue;
    if (seenCodes.has(code)) continue;
    seenCodes.add(code);
    result.push({ name, code });
  }
  return result;
}
/* 清洗名字：移除結尾的全形「：」或半形「:」並去空白 */
function cleanName(line) { return line.replace(/[：:]\s*$/, "").trim(); }
/* 清洗亂碼：全形［轉半形 [，並去空白（不自動補 ]） */
function cleanCode(line) { return line.replace(/［/g, "[").trim(); }


/* ---------- 4. 從 Supabase 讀取全部資料 ---------- */
async function loadEntries() {
  if (!db) return;
  const { data, error } = await db
    .from("entries")
    .select("id,name,code,created_at,pending")
    .order("created_at", { ascending: true });
  if (error) { showToast("讀取失敗：" + error.message); return; }
  entries = data || [];
  loaded = true;
  renderAll();
}

/* 三張列表的統一渲染入口（編輯狀態切換、新增、刪除、確認都呼叫它，三張一起同步） */
function renderAll() {
  renderResults();
  renderPending();
  renderRecent();
}

/* 待確認清單：篩出 pending=true 的全部項目（不限筆數），用既有的 buildViewRow / buildEditRow 來建，行為就跟搜尋結果一致 */
function renderPending() {
  const listEl = document.getElementById("pendingList");
  if (!listEl) return;
  listEl.innerHTML = "";

  const pendingItems = entries.filter(e => e.pending);
  if (pendingItems.length === 0) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "目前沒有待確認的項目";
    listEl.appendChild(li);
    return;
  }

  // 越新的待確認排越前面
  pendingItems
    .sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""))
    .forEach(item => {
      listEl.appendChild(
        editingId === item.id ? buildEditRow(item) : buildViewRow(item)
      );
    });
}

/* 把一筆從「待確認」轉成「已確認」 */
async function confirmEntry(id) {
  if (!db) return;
  const { error } = await db.from("entries").update({ pending: false }).eq("id", id);
  if (error) { showToast("確認失敗：" + error.message); return; }
  showToast("已確認");
  loadEntries();
}

/* ---------- 最近新增（管理員可見） ----------
   從 entries 取 created_at 最新的前 N 筆顯示。
   未登入時 .admin-only 容器是 display:none，所以畫面不會出現；
   但函式仍會跑，這沒副作用，且登入瞬間就有資料可看。 */
function renderRecent() {
  const listEl = document.getElementById("recentList");
  if (!listEl) return;
  listEl.innerHTML = "";

  if (entries.length === 0) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "目前尚無資料";
    listEl.appendChild(li);
    return;
  }

  // 取最新 8 筆。slice 後排序，不污染原陣列。
  const recent = entries
    .slice()
    .sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""))
    .slice(0, 8);

  recent.forEach(item => {
    const li = document.createElement("li");

    const nameDiv = document.createElement("div");
    nameDiv.className = "result-name";
    nameDiv.textContent = item.name;

    const codeDiv = document.createElement("div");
    codeDiv.className = "result-code";
    codeDiv.textContent = item.code;

    const timeDiv = document.createElement("div");
    timeDiv.className = "recent-time";
    timeDiv.textContent = formatRecentTime(item.created_at);

    li.appendChild(nameDiv);
    li.appendChild(codeDiv);
    li.appendChild(timeDiv);
    listEl.appendChild(li);
  });
}

/* 把 ISO timestamp 轉成「3 分鐘前 / 2 小時前 / 5 月 31 日」這種人類可讀格式 */
function formatRecentTime(iso) {
  if (!iso) return "";
  const t = new Date(iso).getTime();
  if (Number.isNaN(t)) return "";
  const diff = Date.now() - t;
  const min = Math.floor(diff / 60000);
  if (min < 1) return "剛剛";
  if (min < 60) return `${min} 分鐘前`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} 小時前`;
  const day = Math.floor(hr / 24);
  if (day < 7) return `${day} 天前`;
  const d = new Date(iso);
  return `${d.getMonth() + 1} 月 ${d.getDate()} 日`;
}


/* ---------- 5. 搜尋 + 顯示結果 ----------
   名字或亂碼只要「包含」輸入文字即算符合（不分大小寫）；
   搜尋欄空白時不列出全部，只顯示提示。 */
function renderResults() {
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  const listEl = document.getElementById("results");
  const countEl = document.getElementById("count");

  listEl.innerHTML = ""; // 清空我們自己產生的節點（安全）

  if (query === "") {
    countEl.textContent = "";
    const li = document.createElement("li");
    li.className = "empty";
    shownIds = new Set();
    li.textContent = loaded ? `已收錄 ${entries.length} 筆` : "資料載入中";
    listEl.appendChild(li);
    return;
  }

  const matched = entries.filter(item =>
    item.name.toLowerCase().includes(query) ||
    item.code.toLowerCase().includes(query)
  );

  if (!loaded) {
    countEl.textContent = "資料載入中";
    return;
  }

  if (matched.length === 0) {
    shownIds = new Set();
    countEl.textContent = "";
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "查無資料，換名字或亂碼的一小段試試";
    listEl.appendChild(li);
    return;
  }

  countEl.textContent = `共 ${matched.length} 筆結果`;

  // 全程用 textContent / DOM 建立，不使用 innerHTML 插入使用者輸入，避免 XSS
  let fresh = 0;
  matched.forEach(item => {
    const editing = editingId === item.id;
    const li = editing ? buildEditRow(item) : buildViewRow(item);
    listEl.appendChild(li);
    if (editing) return;
    const nameText = li.querySelector(".name-text");
    setHighlighted(nameText, item.name, query);
    setHighlighted(li.querySelector(".result-code"), item.code, query);
    if (!shownIds.has(item.id) && fresh < 8) decodeName(nameText, item, query, fresh++ * 0.04);
  });
  shownIds = new Set(matched.map(item => item.id));
}

/* 建立「一般顯示」列：訪客只看到名字與亂碼；管理員才看到編輯／刪除 */
function buildViewRow(item) {
  const li = document.createElement("li");

  const nameEl = document.createElement("div");
  nameEl.className = "result-name";
  const nameText = document.createElement("span");
  nameText.className = "name-text";
  nameText.textContent = item.name;
  nameEl.appendChild(nameText);
  if (item.pending) {
    const badge = document.createElement("span");
    badge.className = "pending-badge";
    badge.textContent = "待確認";
    nameEl.appendChild(badge);
  }

  const codeEl = document.createElement("div");
  codeEl.className = "result-code";
  codeEl.textContent = item.code;

  li.appendChild(nameEl);
  li.appendChild(codeEl);

  if (!isAdmin) return li;

  const actions = document.createElement("div");
  actions.className = "result-actions";

  if (item.pending) {
    const confirmBtn = document.createElement("button");
    confirmBtn.className = "mini";
    confirmBtn.textContent = "確認";
    confirmBtn.onclick = () => confirmEntry(item.id);
    actions.appendChild(confirmBtn);
  }

  const editBtn = document.createElement("button");
  editBtn.className = "secondary mini";
  editBtn.textContent = "編輯";
  editBtn.onclick = () => { editingId = item.id; renderAll(); };

  const delBtn = document.createElement("button");
  delBtn.className = "danger mini";
  delBtn.textContent = "刪除";
  delBtn.onclick = () => deleteEntry(item.id);

  actions.appendChild(editBtn);
  actions.appendChild(delBtn);
  li.appendChild(actions);
  return li;
}

/* 建立「編輯中」列（輸入框 + 儲存／取消） */
function buildEditRow(item) {
  const li = document.createElement("li");
  const box = document.createElement("div");
  box.className = "edit-fields";

  const nameInput = document.createElement("input");
  nameInput.type = "text"; nameInput.value = item.name; nameInput.placeholder = "名字";

  const codeInput = document.createElement("input");
  codeInput.type = "text"; codeInput.value = item.code; codeInput.placeholder = "匿名亂碼"; codeInput.className = "code-input";

  const actions = document.createElement("div");
  actions.className = "result-actions";

  const saveBtn = document.createElement("button");
  saveBtn.className = "mini";
  saveBtn.textContent = "儲存";
  saveBtn.onclick = () => saveEdit(item.id, nameInput.value, codeInput.value);

  const cancelBtn = document.createElement("button");
  cancelBtn.className = "ghost mini";
  cancelBtn.textContent = "取消";
  cancelBtn.onclick = () => { editingId = null; renderAll(); };

  actions.appendChild(saveBtn);
  actions.appendChild(cancelBtn);
  box.appendChild(nameInput);
  box.appendChild(codeInput);
  box.appendChild(actions);
  li.appendChild(box);
  return li;
}


/* ---------- 6 & 12. 新增資料（防止重複亂碼） ----------
   亂碼的唯一性同時由資料庫的 UNIQUE 約束強制保證，重複時會收到 23505 錯誤。 */
async function addEntry(pending = false) {
  if (!db) return;
  const nameEl = document.getElementById("addName");
  const codeEl = document.getElementById("addCode");
  const name = nameEl.value.trim();
  let code = cleanCode(codeEl.value);

  if (!name) { showToast("名字不能空白"); return; }
  if (!code) { showToast("匿名亂碼不能空白"); return; }
  if (!code.startsWith("[")) code = "[" + code; // 沒有 [ 就自動補（不補 ]）

  const { error } = await db.from("entries").insert({ name, code, pending });
  if (error) {
    showToast(error.code === "23505" ? "此匿名亂碼已存在" : "新增失敗：" + error.message);
    return;
  }
  nameEl.value = ""; codeEl.value = "";
  showToast(pending ? "已加入待確認" : "新增成功");
  loadEntries();
}


/* ---------- 7. 刪除資料（單筆，含自訂確認框） ---------- */
async function deleteEntry(id) {
  if (!db) return;
  if (!(await showConfirm("確定要刪除這筆資料嗎？"))) return;
  const { error } = await db.from("entries").delete().eq("id", id);
  if (error) { showToast("刪除失敗：" + error.message); return; }
  if (editingId === id) editingId = null;
  showToast("已刪除");
  loadEntries();
}


/* ---------- 8. 編輯資料（儲存修改，防重複） ---------- */
async function saveEdit(id, newName, newCode) {
  if (!db) return;
  newName = newName.trim();
  newCode = cleanCode(newCode);
  if (!newName) { showToast("名字不能空白"); return; }
  if (!newCode) { showToast("匿名亂碼不能空白"); return; }
  if (!newCode.startsWith("[")) newCode = "[" + newCode;

  const { error } = await db.from("entries").update({ name: newName, code: newCode }).eq("id", id);
  if (error) {
    showToast(error.code === "23505" ? "此匿名亂碼已存在" : "更新失敗：" + error.message);
    return;
  }
  editingId = null;
  showToast("已更新");
  loadEntries();
}


/* 自動匯入預設：雲端是空的、且目前是管理員時，把預設資料寫進雲端 */
async function seedIfEmpty() {
  if (!db || !isAdmin) return;
  const { count, error } = await db.from("entries").select("id", { count: "exact", head: true });
  if (error || (count && count > 0)) return; // 已經有資料就不重複匯入
  const res = await db.from("entries").upsert(parseRawData(RAW_DATA), { onConflict: "code", ignoreDuplicates: true });
  if (!res.error) { showToast("已匯入預設資料"); loadEntries(); }
}


/* ---------- 小工具：自訂確認對話框（回傳 Promise<boolean>） ---------- */
function showConfirm(message) {
  return new Promise(resolve => {
    const overlay = document.getElementById("confirmOverlay");
    document.getElementById("confirmMsg").textContent = message;
    overlay.style.display = "flex";
    const ok = document.getElementById("confirmOk");
    const cancel = document.getElementById("confirmCancel");
    function close(result) {
      overlay.style.display = "none";
      ok.onclick = null; cancel.onclick = null;
      resolve(result);
    }
    ok.onclick = () => close(true);
    cancel.onclick = () => close(false);
  });
}

/* ---------- 小工具：顯示提示訊息 ---------- */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}


/* ---------- 管理員：登入 / 登出（使用 Supabase Auth，真正的身分驗證） ---------- */
function applyAdminUI() {
  document.body.classList.toggle("admin", isAdmin);
  document.getElementById("adminBtn").textContent = isAdmin ? "管理員登出" : "管理員登入";
  if (isAdmin) document.getElementById("loginForm").style.display = "none";
}

/* 點「管理員登入」：已登入就登出；未登入就顯示／隱藏登入表單 */
function toggleAdmin() {
  // demo 模式下「管理員登出」= 離開模擬模式 → 移除 #demo 並重新載入
  if (DEMO_MODE && isAdmin) {
    history.replaceState(null, "", location.pathname + location.search);
    location.reload();
    return;
  }
  if (!db) { showToast("尚未設定 Supabase 連線"); return; }
  if (isAdmin) {
    db.auth.signOut(); // 之後由 onAuthStateChange 更新畫面
    showToast("已登出");
  } else {
    const form = document.getElementById("loginForm");
    form.style.display = form.style.display === "none" ? "grid" : "none";
  }
}

/* 按「登入」：用 Email + 密碼向 Supabase 驗證 */
async function doLogin() {
  if (!db) return;
  const email = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value;
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) { showToast("登入失敗：帳號或密碼錯誤"); return; }
  document.getElementById("loginUser").value = "";
  document.getElementById("loginPass").value = "";
  showToast("已登入管理員"); // 畫面切換由 onAuthStateChange 處理
}


/* ---------- 初始化 ---------- */
async function init() {
  const listEl = document.getElementById("results");

  // 模擬模式：顯示橫條 + 直接視為已登入
  if (DEMO_MODE) {
    document.getElementById("demoBanner").style.display = "block";
    isAdmin = true;
  }

  // 還沒設定好 Supabase 也不在 demo 模式 → 顯示提示就好
  if (!db) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "尚未設定 Supabase 連線。請編輯 index.html，填入 SUPABASE_URL 與 SUPABASE_ANON_KEY 後再部署。";
    listEl.appendChild(li);
    return;
  }

  document.getElementById("searchInput").addEventListener("input", renderResults);
  document.getElementById("addBtn").addEventListener("click", () => addEntry(false));
  document.getElementById("addPendingBtn").addEventListener("click", () => addEntry(true));
  document.getElementById("adminBtn").addEventListener("click", toggleAdmin);
  document.getElementById("loginForm").addEventListener("submit", e => { e.preventDefault(); doLogin(); });

  applyAdminUI();

  // 監聽登入狀態：登入/登出時自動更新畫面；登入後若雲端是空的就匯入預設
  db.auth.onAuthStateChange((event, session) => {
    isAdmin = !!session;
    applyAdminUI();
    renderAll();
    if (isAdmin) seedIfEmpty();
  });

  renderResults();
  await loadEntries();

  // 即時同步：別人（或你）改動資料時自動重新載入。
  // （需在 Supabase 後台為 entries 開啟 Realtime；沒開也沒關係，重新整理即可看到最新。）
  db.channel("entries-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "entries" }, () => loadEntries())
    .subscribe();
}

init();

</script>
